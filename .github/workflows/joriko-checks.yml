name: Joriko model and browser checks
on:
  pull_request:
    paths: ['joriko*', 'script.js', 'tests/joriko*', '.github/workflows/joriko-checks.yml']
  push:
    branches: [main]
    paths: ['joriko*', 'script.js', 'tests/joriko*', '.github/workflows/joriko-checks.yml']
permissions:
  contents: read
jobs:
  joriko:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/joriko.cjs
      - run: python3 tests/launch-metadata.py
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/joriko-http.log 2>&1 &
          node tests/joriko-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joriko-browser-screenshots
          path: /tmp/joriko-qa/
          if-no-files-found: warn
          retention-days: 7
