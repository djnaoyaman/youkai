  <h1>福井県</h1>

<div class="pref-intro"><p>福井県の台帳、詳細記事（妖怪図鑑掲載分）があるのは「<ruby>牛蒡種<rt>ごぼうだね</rt></ruby>」。</p><p>これは正直、書いていて気が重くなる一体だった。</p><p>このほか台帳に登録されているのはあっぽっしゃ、井守、ぴしゃがつく。名前は確認できているけれど、伝承の中身はまだ調べきれていない。捏造するくらいなら空欄のままにしておく、というのがこの台帳のルール。</p></div>
